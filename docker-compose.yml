services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsw_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: itsw
      DB_USERNAME: user
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itsw_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itsw_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - itsw_network

  db:
    image: mysql:8.0
    container_name: itsw_db
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: itsw
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      # Папка для автоимпорта дампа (см. Шаг 3)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - itsw_network

volumes:
  mysql_data:
  backend_vendor:

networks:
  itsw_network:
    driver: bridge